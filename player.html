<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>i love ACG · 播放</title>
  <style>
    :root {
      /* 极简留白视觉系统 */
      --color-canvas: #ffffff;
      --color-ink: #111111;
      --color-ink-soft: #555555;
      --color-ink-faint: #999999;
      --color-line: #111111;
      --color-line-soft: #d9d9d9;
      --color-accent: #a78bfa;   /* 唯一高亮色：淡紫 */
      --color-focus: #000000;

      --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      --space-page: clamp(1rem, 4vw, 2.5rem);
      --space-stack: clamp(1.25rem, 3vw, 2rem);
      --border-w: 1.5px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 60rem; margin: 0 auto; padding: var(--space-page); min-height: 100vh; display: flex; flex-direction: column; }
    .page main { flex: 1 1 auto; }
    a { color: inherit; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }

    /* ---------- 顶部导航 ---------- */
    .topbar {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
      border-bottom: var(--border-w) solid var(--color-line);
      padding-bottom: 0.8rem;
    }
    .brand { line-height: 1.1; text-decoration: none; }
    .brand .i { font-size: 0.95rem; letter-spacing: 0.05em; }
    .brand .logo h1 { margin: 0; font-size: 1.9rem; font-weight: 800; letter-spacing: 0.02em; }
    .brand .url { font-family: var(--font-mono); font-size: 0.78rem; color: var(--color-ink-faint); margin-top: 0.1rem; }
    .nav { display: flex; gap: 1rem; font-size: 1rem; margin-top: 0.3rem; }
    .nav a { text-decoration: none; color: var(--color-ink-soft); }
    .nav a:hover { color: var(--color-accent); }

    /* ---------- 播放器 ---------- */
    main { margin-top: var(--space-stack); max-width: 48rem; }
    .player-name { font-size: 1.05rem; margin: 0 0 0.6rem; font-weight: 700; }
    .player-name .k { color: var(--color-ink-soft); font-weight: 400; }
    .stage { border: var(--border-w) solid var(--color-line); background: #fff; }
    .stage video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
    .stage .ph {
      aspect-ratio: 16 / 9;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; letter-spacing: 0.3em; color: var(--color-ink);
    }

    /* 进度条：单横线 + 圆形滑块 */
    .seek {
      position: relative; margin-top: 0.7rem; height: 20px; cursor: pointer;
      display: flex; align-items: center;
    }
    .seek .track { position: relative; width: 100%; height: 3px; background: var(--color-line-soft); }
    .seek .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--color-accent); }
    .seek .thumb {
      position: absolute; top: 50%; left: 0%;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--color-ink); border: 2px solid #fff;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px var(--color-ink);
    }
    .time-row {
      display: flex; justify-content: space-between;
      margin-top: 0.35rem; font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-ink-soft);
    }

    /* ---------- 底部信息区 ---------- */
    .foot {
      margin-top: auto;
      border-top: var(--border-w) solid var(--color-line);
      padding-top: 0.8rem;
      display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
      font-size: 0.82rem; color: var(--color-ink-soft);
    }
    .foot .reveal { font-family: var(--font-mono); font-size: 0.9rem; color: var(--color-ink-soft); }
    .foot a { color: var(--color-ink); text-decoration: underline; text-underline-offset: 3px; }

    /* 持续加载动画 */
    .loading {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.9rem 0.4rem;
      color: var(--color-ink-faint); font-family: var(--font-mono); font-size: 0.85rem;
    }
    .spinner {
      width: 16px; height: 16px; flex: 0 0 auto;
      border: 2px solid var(--color-line-soft);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media print { .seek, .stage video { display: none; } }
  </style>
</head>
<body>
  <div class="page">

    <!-- 顶部导航 -->
    <header class="topbar">
      <a class="brand" href="https://iloveacg.github.io/index.html" target="_blank" rel="noopener noreferrer">
        <div class="i">i love</div>
        <div class="logo"><h1>ACG</h1></div>
        <div class="url">https://iloveacg.github.io</div>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="https://iloveacg.github.io/index.html" target="_blank" rel="noopener noreferrer">首页</a>
      </nav>
    </header>

    <main>
      <p class="player-name"><span class="k">播放:</span> <span id="playingName">—</span></p>
      <div class="stage" id="stage">
        <div class="loading" id="placeholder"><span class="spinner" aria-hidden="true"></span>正在加载视频…</div>
        <video id="player" controls playsinline preload="metadata" style="display:none"></video>
      </div>
      <div class="seek" id="seek" aria-label="播放进度">
        <div class="track">
          <div class="fill" id="fill"></div>
          <div class="thumb" id="thumb"></div>
        </div>
      </div>
      <div class="time-row">
        <span id="tCur">00:00</span><span id="tDur">00:00</span>
      </div>
    </main>

    <!-- 底部信息 -->
    <footer class="foot">
      <span class="reveal">i love ACG - 认真你就输了……</span>
      <span>网站更新于 2026/10/16 by: ch3oh</span>
    </footer>
  </div>

  <script>
    (function () {
      "use strict";

      var player = document.getElementById("player");
      var phEl = document.getElementById("placeholder");
      var nameEl = document.getElementById("playingName");
      var fillEl = document.getElementById("fill");
      var thumbEl = document.getElementById("thumb");
      var seekEl = document.getElementById("seek");
      var tCur = document.getElementById("tCur");
      var tDur = document.getElementById("tDur");

      // 读取 ?v= 参数（视频文件名）
      var v = new URLSearchParams(location.search).get("v");
      var fileName = v ? decodeURIComponent(v) : "";

      function fmt(sec) {
        if (isNaN(sec) || sec < 0) sec = 0;
        var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
        return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
      }

      function loadVideo(name) {
        if (!name) {
          nameEl.textContent = "—";
          return;
        }
        nameEl.textContent = name.replace(/\.(mp4|webm|ogg|mov|m4v)$/i, "");
        phEl.style.display = "none";
        player.style.display = "block";
        // 视频与页面同仓库根目录，相对路径即可
        player.src = name;
        player.load();
        player.play().catch(function () {});
      }

      // 进度栏跳转
      seekEl.addEventListener("click", function (e) {
        if (!player.duration || isNaN(player.duration)) return;
        var track = seekEl.querySelector(".track");
        var rect = track.getBoundingClientRect();
        var ratio = (e.clientX - rect.left) / (rect.width || 1);
        ratio = Math.min(1, Math.max(0, ratio));
        player.currentTime = ratio * player.duration;
        updateProgress();
      });

      function updateProgress() {
        if (!player.duration || isNaN(player.duration)) { fillEl.style.width = "0%"; thumbEl.style.left = "0%"; return; }
        var ratio = (player.currentTime / player.duration) * 100;
        fillEl.style.width = ratio + "%";
        thumbEl.style.left = ratio + "%";
      }
      player.addEventListener("timeupdate", function () {
        tCur.textContent = fmt(player.currentTime);
        updateProgress();
      });
      player.addEventListener("loadedmetadata", function () {
        tDur.textContent = fmt(player.duration);
      });

      loadVideo(fileName);
    })();
  </script>
</body>
</html>
